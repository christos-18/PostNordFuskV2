<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>PostNord Fusk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/bilder/ikon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="overlay">
    <!-- Settings -->
    <button class="settings-btn" id="settingsBtn">⚙️</button>

    <!-- User badge -->
    <div class="user-badge" id="userBadge" style="display:none;">
      <span class="user-icon">👤</span>
      <span class="user-name" id="userNameDisplay"></span>
      <button class="badge-logout-btn" id="badgeLogoutBtn">Logga ut</button>
    </div>

    <!-- 🔑 ENDA platsen där knappar ska renderas -->
    <div class="container" id="buttonContainer">
      <!-- Buttons rendered by script.js -->
    </div>
  </div>

  <!-- Editor Modal -->
  <div class="modal" id="editorModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Redigera Scripts</h2>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="script-list">
          <button class="add-script-btn" id="addScriptBtn">➕ Lägg till nytt script</button>
          <div class="script-items" id="scriptList"></div>
        </div>
        <div class="editor-container">
          <div class="editor-toolbar">
            <button class="save-btn" id="saveBtn">💾 Spara</button>
            <button class="reset-btn" id="resetBtn">↺ Återställ</button>
          </div>
          <textarea id="codeEditor" spellcheck="false"></textarea>
          <div class="status-message" id="statusMessage"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Dialog -->
  <div class="input-dialog" id="inputDialog">
    <div class="input-dialog-content">
      <h3>Lägg till nytt script</h3>
      <input type="text" id="scriptNameInput" placeholder="Namn på scriptet...">
      <input type="text" id="scriptEmojiInput" placeholder="Emoji (t.ex. 🎯)" maxlength="2">
      <div class="input-dialog-buttons">
        <button class="cancel-btn" id="dialogCancel">Avbryt</button>
        <button class="confirm-btn" id="dialogConfirm">Skapa</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-dialog" id="confirmDialog">
    <div class="confirm-dialog-content">
      <h3>Ta bort script?</h3>
      <p id="confirmMessage"></p>
      <div class="confirm-dialog-buttons">
        <button class="cancel-btn" id="confirmCancel">Avbryt</button>
        <button class="delete-confirm-btn" id="confirmDelete">Ta bort</button>
      </div>
    </div>
  </div>

  <!-- Button Designer Dialog -->
  <div class="button-designer-dialog" id="buttonDesignerDialog">
    <div class="button-designer-content">
      <h3>🎨 Design Knapp</h3>
      
      <!-- Preview -->
      <div class="designer-preview">
        <button class="copy-btn preview-button" id="previewButton">
          <span id="previewText">🎯 Preview</span>
        </button>
      </div>

      <!-- Style Options -->
      <div class="designer-options">
        
        <!-- Color Preset -->
        <div class="designer-section">
          <label>Färgtema:</label>
          <div class="color-presets">
            <button class="preset-btn console" data-style="console">Konsol (Blå)</button>
            <button class="preset-btn excel" data-style="excel">Excel (Grön)</button>
            <button class="preset-btn message" data-style="message">Meddelande (Lila)</button>
            <button class="preset-btn custom" data-style="custom">Custom (Anpassad)</button>
          </div>
        </div>

        <!-- Custom Colors (shown when custom is selected) -->
        <div class="designer-section" id="customColorSection" style="display:none;">
          <label>Primärfärg:</label>
          <input type="color" id="primaryColor" value="#3b82f6">
          
          <label>Sekundärfärg:</label>
          <input type="color" id="secondaryColor" value="#4f46e5">
          
          <label>Transparens:</label>
          <input type="range" id="transparency" min="0" max="100" value="30">
          <span id="transparencyValue">30%</span>
        </div>

        <!-- Border & Effects -->
        <div class="designer-section">
          <label>Kantradius:</label>
          <input type="range" id="borderRadius" min="0" max="30" value="12">
          <span id="borderRadiusValue">12px</span>
          
          <label>Kanttjocklek:</label>
          <input type="range" id="borderWidth" min="0" max="5" value="1">
          <span id="borderWidthValue">1px</span>
          
          <label>
            <input type="checkbox" id="glowEffect" checked>
            Glow-effekt
          </label>
          
          <label>
            <input type="checkbox" id="gradientEffect" checked>
            Gradient-effekt
          </label>
        </div>
      </div>

      <!-- Buttons -->
      <div class="button-designer-buttons">
        <button class="cancel-btn" id="designerCancel">Avbryt</button>
        <button class="confirm-btn" id="designerSave">Spara Design</button>
      </div>
    </div>
  </div>

  <!-- Login Dialog -->
  <div class="login-dialog" id="loginDialog">
    <div class="login-dialog-content">
      <h2>🔐 Logga in</h2>
      <p>Logga in för att redigera scripts</p>
      <input type="text" id="loginUsername" placeholder="Användarnamn">
      <input type="password" id="loginPassword" placeholder="Lösenord">
      <div class="login-error" id="loginError"></div>
      <div class="login-dialog-buttons">
        <button class="cancel-btn" id="loginCancel">Avbryt</button>
        <button class="confirm-btn" id="loginConfirm">Logga in</button>
      </div>
      <div class="login-footer">
        <small>Inloggad som: <span id="currentUser">Ingen</span></small>
        <button class="logout-btn" id="logoutBtn" style="display:none;">Logga ut</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
